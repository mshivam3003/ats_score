[project]
name = "ats-score"
version = "0.1.0"
description = "ResumeRise AI - ATS Resume Scorer and Career Agent with FastAPI & Vite/React"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "PyPDF2>=3.0",
    "python-docx>=0.9",
    "pypandoc>=1.8",
    "requests>=2.33",
    "lxml>=6.0",
    "aiofiles>=23.0",
    "pywin32>=306; platform_system == 'Windows'",
]

[tool.vercel]
entrypoint = "api.index:app"

[tool.vercel.scripts]
build = "npm --prefix ats_ui/ResumeRise-fullstack/ResumeRise/frontend install && npm --prefix ats_ui/ResumeRise-fullstack/ResumeRise/frontend run build"
