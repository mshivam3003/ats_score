[project]
name = "resumerise-api"
version = "0.1.0"
description = "ResumeRise AI FastAPI Application"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "PyPDF2>=3.0",
    "python-docx>=0.9",
    "pypandoc>=1.8",
    "requests>=2.33",
    "lxml>=6.0",
    "aiofiles>=23.0",
]

[tool.vercel]
entrypoint = "api:app"
